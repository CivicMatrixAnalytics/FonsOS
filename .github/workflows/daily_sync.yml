name: FonsOS Daily Ingestion Worker

on:
  schedule:
    - cron: '0 1 * * *' # Daily at 1:00 AM UTC (Kaalai 6:30 AM IST)
  workflow_dispatch:

jobs:
  sync-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase feedparser google-genai python-dotenv requests pandas openpyxl xlrd

      - name: Setup Service Account Credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GCP_SA_KEY" > service_account.json

      - name: Execute Daily Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python daily_sync.py